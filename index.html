<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Recommendation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4af37;
            --secondary: #2c3e50;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #34495e;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), #f39c12);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Content */
        .content {
            padding: 40px;
        }

        /* Survey Form */
        .survey-section {
            display: block;
        }

        .survey-section.hidden {
            display: none;
        }

        .question {
            margin-bottom: 30px;
        }

        .question label {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .question label .required {
            color: var(--accent);
        }

        .radio-group, .checkbox-group {
            display: grid;
            gap: 12px;
        }

        .option {
            background: var(--light);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .option:hover {
            background: #d5dbdb;
            transform: translateX(5px);
        }

        .option input[type="radio"],
        .option input[type="checkbox"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .option.selected {
            background: #d4f1f4;
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), #f39c12);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid var(--light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Results Section */
        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .section-title {
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 100px;
            height: 4px;
            background: var(--primary);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        /* Celebrity Cards */
        .celebrity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .celebrity-card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .celebrity-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .celebrity-card.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, #fff9e6, white);
        }

        .celebrity-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }

        .celebrity-info {
            padding: 20px;
        }

        .celebrity-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .celebrity-match {
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .celebrity-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag {
            background: var(--light);
            color: var(--dark);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
        }

        .celebrity-description {
            color: #7f8c8d;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Products Section */
        .products-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        .products-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            background: var(--secondary);
            margin-bottom: 30px;
        }

        .celebrity-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .celebrity-header h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: var(--light);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .product-price {
            color: var(--accent);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .product-category {
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            display: inline-block;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .product-occasions {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .match-score {
            background: #27ae60;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        /* Error Message */
        .error-message {
            background: #fadbd8;
            border: 2px solid var(--accent);
            color: #c0392b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .content {
                padding: 20px;
            }

            .celebrity-grid,
            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: slideInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>✨ Jewelry Style Finder</h1>
            <p>Discover your perfect jewelry match with AI-powered recommendations</p>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Survey Section -->
            <div class="survey-section" id="surveySection">
                <h2 class="section-title">Tell Us About Your Style</h2>
                
                <div class="error-message" id="errorMessage"></div>

                <form id="surveyForm">
                    <!-- Question 1: Style Preference -->
                    <div class="question">
                        <label>
                            1. How would you describe your overall style? <span class="required">*</span>
                        </label>
                        <div class="radio-group">
                            <label class="option">
                                <input type="radio" name="style_preference" value="Classic and timeless - I love pieces that never go out of style" required>
                                <span>Classic and timeless - I love pieces that never go out of style</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="style_preference" value="Modern and minimal - Clean lines and understated elegance">
                                <span>Modern and minimal - Clean lines and understated elegance</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="style_preference" value="Bold and statement-making - I want to stand out">
                                <span>Bold and statement-making - I want to stand out</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="style_preference" value="Elegant and sophisticated - Refined with subtle luxury">
                                <span>Elegant and sophisticated - Refined with subtle luxury</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="style_preference" value="Playful and eclectic - I like to mix and experiment">
                                <span>Playful and eclectic - I like to mix and experiment</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="style_preference" value="Romantic and delicate - Soft, feminine designs">
                                <span>Romantic and delicate - Soft, feminine designs</span>
                            </label>
                        </div>
                    </div>

                    <!-- Question 2: Occasions -->
                    <div class="question">
                        <label>
                            2. What occasions are you shopping for? <span class="required">*</span> (Select multiple)
                        </label>
                        <div class="checkbox-group">
                            <label class="option">
                                <input type="checkbox" name="occasions" value="Weddings">
                                <span>Weddings</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="occasions" value="Engagement/Anniversary">
                                <span>Engagement/Anniversary</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="occasions" value="Formal Events">
                                <span>Formal Events</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="occasions" value="Daily Wear">
                                <span>Daily Wear</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="occasions" value="Office/Professional">
                                <span>Office/Professional</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="occasions" value="Cocktail Parties">
                                <span>Cocktail Parties</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="occasions" value="Special Celebrations">
                                <span>Special Celebrations</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="occasions" value="Casual Events">
                                <span>Casual Events</span>
                            </label>
                        </div>
                    </div>

                    <!-- Question 3: Jewelry Type -->
                    <div class="question">
                        <label>
                            3. What type of jewelry speaks to you most? <span class="required">*</span>
                        </label>
                        <div class="radio-group">
                            <label class="option">
                                <input type="radio" name="jewelry_type" value="Solitaire diamonds - Simple and stunning" required>
                                <span>Solitaire diamonds - Simple and stunning</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="jewelry_type" value="Multi-stone pieces - Intricate and detailed">
                                <span>Multi-stone pieces - Intricate and detailed</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="jewelry_type" value="Geometric designs - Modern and architectural">
                                <span>Geometric designs - Modern and architectural</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="jewelry_type" value="Nature-inspired - Floral, organic motifs">
                                <span>Nature-inspired - Floral, organic motifs</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="jewelry_type" value="Vintage-inspired - Heritage and tradition">
                                <span>Vintage-inspired - Heritage and tradition</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="jewelry_type" value="Contemporary art pieces - Unique and fashion-forward">
                                <span>Contemporary art pieces - Unique and fashion-forward</span>
                            </label>
                        </div>
                    </div>

                    <!-- Question 4: Sparkle Level -->
                    <div class="question">
                        <label>
                            4. How much sparkle do you prefer? <span class="required">*</span>
                        </label>
                        <div class="radio-group">
                            <label class="option">
                                <input type="radio" name="sparkle_level" value="Subtle sparkle - Just a hint of shine" required>
                                <span>Subtle sparkle - Just a hint of shine</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="sparkle_level" value="Moderate sparkle - Noticeable but balanced">
                                <span>Moderate sparkle - Noticeable but balanced</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="sparkle_level" value="Maximum sparkle - I want all the brilliance">
                                <span>Maximum sparkle - I want all the brilliance</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="sparkle_level" value="It depends on the occasion">
                                <span>It depends on the occasion</span>
                            </label>
                        </div>
                    </div>

                    <!-- Question 5: Budget -->
                    <div class="question">
                        <label>
                            5. What's your budget range? <span class="required">*</span>
                        </label>
                        <div class="radio-group">
                            <label class="option">
                                <input type="radio" name="budget" value="Under ₹50,000 (Accessible luxury)" required>
                                <span>Under ₹50,000 (Accessible luxury)</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="budget" value="₹50,000 - ₹1,50,000 (Premium)">
                                <span>₹50,000 - ₹1,50,000 (Premium)</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="budget" value="₹1,50,000 - ₹3,00,000 (Luxury)">
                                <span>₹1,50,000 - ₹3,00,000 (Luxury)</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="budget" value="Above ₹3,00,000 (Ultra-luxury)">
                                <span>Above ₹3,00,000 (Ultra-luxury)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Question 6: Celebrity Inspiration (Optional) -->
                    <div class="question">
                        <label>
                            6. Any celebrity style inspirations? (Optional)
                        </label>
                        <input type="text" name="celebrity_inspiration" placeholder="e.g., Elegant like Deepika Padukone">
                    </div>

                    <!-- Question 7: Additional Preferences (Optional) -->
                    <div class="question">
                        <label>
                            7. Any other preferences? (Optional)
                        </label>
                        <textarea name="additional_preferences" placeholder="Metal color, gemstone preferences, etc."></textarea>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">
                        ✨ Get My Recommendations
                    </button>
                </form>
            </div>

            <!-- Loading -->
            <div class="loading" id="loadingSection">
                <div class="spinner"></div>
                <h3>Finding your perfect matches...</h3>
                <p>Analyzing your style preferences with AI</p>
            </div>

            <!-- Results Section - Celebrity Cards -->
            <div class="results-section" id="resultsSection">
                <h2 class="section-title">Your Celebrity Style Matches</h2>
                <p style="text-align: center; color: #7f8c8d; margin-bottom: 40px;">
                    Click on a celebrity to see jewelry recommendations inspired by their style
                </p>
                <div class="celebrity-grid" id="celebrityGrid"></div>
            </div>

            <!-- Products Section -->
            <div class="products-section" id="productsSection">
                <button class="btn back-btn" onclick="backToCelebrities()">
                    ← Back to Celebrity Matches
                </button>
                
                <div class="celebrity-header" id="celebrityHeader"></div>
                
                <div class="products-grid" id="productsGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let recommendationsData = null;

        // Add interaction for options
        document.querySelectorAll('.option').forEach(option => {
            const input = option.querySelector('input');
            
            option.addEventListener('click', () => {
                if (input.type === 'radio') {
                    // Remove selected class from siblings
                    option.parentElement.querySelectorAll('.option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    option.classList.add('selected');
                    input.checked = true;
                } else if (input.type === 'checkbox') {
                    option.classList.toggle('selected');
                    input.checked = !input.checked;
                }
            });
        });

        // Form submission
        document.getElementById('surveyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Collect form data
            const formData = new FormData(e.target);
            
            // Validate occasions (at least one required)
            const occasions = formData.getAll('occasions');
            if (occasions.length === 0) {
                showError('Please select at least one occasion');
                return;
            }

            // Build survey object
            const survey = {
                style_preference: formData.get('style_preference'),
                occasions: occasions,
                jewelry_type: formData.get('jewelry_type'),
                sparkle_level: formData.get('sparkle_level'),
                budget: formData.get('budget'),
                celebrity_inspiration: formData.get('celebrity_inspiration') || '',
                additional_preferences: formData.get('additional_preferences') || ''
            };

            // Show loading
            document.getElementById('surveySection').classList.add('hidden');
            document.getElementById('loadingSection').classList.add('active');

            try {
                // Call API
                const response = await fetch(`${API_URL}/api/v1/recommendations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        survey: survey,
                        top_n: 15,
                        celebrity_threshold: 0.4,
                        include_scores: true
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to get recommendations');
                }

                const data = await response.json();
                recommendationsData = data;

                // Hide loading, show results
                document.getElementById('loadingSection').classList.remove('active');
                document.getElementById('resultsSection').classList.add('active');

                // Display celebrities
                displayCelebrities(data.celebrity_product_groups);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingSection').classList.remove('active');
                document.getElementById('surveySection').classList.remove('hidden');
                showError('Unable to connect to recommendation server. Please make sure the server is running on port 8000.');
            }
        });

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            setTimeout(() => {
                errorEl.classList.remove('active');
            }, 5000);
        }

        function displayCelebrities(celebrityGroups) {
            const grid = document.getElementById('celebrityGrid');
            grid.innerHTML = '';

            celebrityGroups.forEach((group, index) => {
                const celeb = group.celebrity;
                const card = document.createElement('div');
                card.className = 'celebrity-card animate-in';
                card.style.animationDelay = `${index * 0.1}s`;
                
                const emoji = ['👑', '✨', '💎'][index] || '⭐';
                
                card.innerHTML = `
                    <div class="celebrity-image">${emoji}</div>
                    <div class="celebrity-info">
                        <div class="celebrity-name">${celeb.name}</div>
                        <div class="celebrity-match">${(celeb.similarity_score * 100).toFixed(0)}% Match</div>
                        <div class="celebrity-tags">
                            ${celeb.primary_vibe_tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div class="celebrity-description">
                            ${celeb.vibe_description.substring(0, 120)}...
                        </div>
                        <div style="margin-top: 15px; color: var(--primary); font-weight: 600;">
                            ${group.products.length} products selected for you
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    showProducts(group);
                });

                grid.appendChild(card);
            });
        }

        function showProducts(celebrityGroup) {
            const celeb = celebrityGroup.celebrity;
            const products = celebrityGroup.products;

            // Update header
            const header = document.getElementById('celebrityHeader');
            header.innerHTML = `
                <h2>✨ ${celeb.name}'s Style Recommendations</h2>
                <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
                    ${celeb.primary_vibe_tags.map(tag => `<span class="tag" style="background: rgba(255,255,255,0.3); color: white; border: 1px solid white;">${tag}</span>`).join('')}
                </div>
                <p style="margin-top: 15px; opacity: 0.9;">${products.length} handpicked pieces matching your style</p>
            `;

            // Display products
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            products.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card animate-in';
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <img src="${product.image_url}" alt="${product.name}" class="product-image" 
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22250%22%3E%3Crect fill=%22%23ecf0f1%22 width=%22280%22 height=%22250%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2240%22 fill=%22%23bdc3c7%22%3E💎%3C/text%3E%3C/svg%3E'">
                    <div class="product-info">
                        <div class="product-category">${product.category.replace('-catalog', '')}</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">₹${product.price}</div>
                        <div class="product-tags">
                            ${product.primary_style_tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div class="product-occasions">
                            📍 ${product.occasions.slice(0, 2).join(', ')}
                        </div>
                        <div class="match-score">
                            Match Score: ${(product.match_score * 100).toFixed(0)}%
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            // Show products section
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('productsSection').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToCelebrities() {
            document.getElementById('productsSection').classList.remove('active');
            document.getElementById('resultsSection').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
